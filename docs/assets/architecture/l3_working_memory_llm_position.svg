<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">LLM receives four inputs: drive state context, retrieved memories, anchor-restricted domain, and current sensor state. It outputs candidates and predictions. It cannot write drive state, cannot access tools directly, and cannot execute.</desc>
