<svg width="100%" viewBox="0 0 720 460" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Anchor System overview</title>
<desc>Anchor System sits across layers. Structural and dynamic anchors shrink the action domain before candidate generation, producing A'(s) from A(s). Mediator remains downstream for release, not generation-time restriction.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g opacity="0.5">
  <rect x="140" y="24" width="440" height="32" rx="6" style="fill:rgb(68,68,65);stroke:rgb(180,178,169);stroke-width:0.5px"/>
  <text x="360" y="44" text-anchor="middle" style="fill:rgb(180,178,169);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">L3 — adaptive deliberation (candidate shaping below)</text>
</g>

<g>
  <rect x="40" y="84" width="640" height="236" rx="12" style="fill:rgb(60,52,137);stroke:rgb(175,169,236);stroke-width:0.5px"/>
  <text x="360" y="108" text-anchor="middle" style="fill:rgb(200,194,245);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500">Anchor System — pre-generative structural restriction</text>
  <text x="360" y="126" text-anchor="middle" style="fill:rgb(175,169,236);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">shrinks candidate domain before reasoning generates candidates</text>

  <rect x="64" y="154" width="180" height="128" rx="8" style="fill:rgb(60,52,137);stroke:rgb(175,169,236);stroke-width:0.5px"/>
  <text x="154" y="178" text-anchor="middle" style="fill:rgb(200,194,245);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500">structural anchors</text>
  <text x="154" y="198" text-anchor="middle" style="fill:rgb(175,169,236);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">continuity / integrity</text>
  <text x="154" y="216" text-anchor="middle" style="fill:rgb(175,169,236);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">deployment capability</text>
  <text x="154" y="234" text-anchor="middle" style="fill:rgb(175,169,236);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">side effect class</text>
  <text x="154" y="252" text-anchor="middle" style="fill:rgb(175,169,236);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">execution boundary</text>

  <rect x="270" y="154" width="180" height="128" rx="8" style="fill:rgb(60,52,137);stroke:rgb(175,169,236);stroke-width:0.5px"/>
  <text x="360" y="178" text-anchor="middle" style="fill:rgb(200,194,245);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500">dynamic anchors</text>
  <text x="360" y="198" text-anchor="middle" style="fill:rgb(175,169,236);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">runtime gate / validity</text>
  <text x="360" y="216" text-anchor="middle" style="fill:rgb(175,169,236);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">L1 threat / status signals</text>
  <text x="360" y="234" text-anchor="middle" style="fill:rgb(175,169,236);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">recent outcome / narrowing</text>
  <text x="360" y="252" text-anchor="middle" style="fill:rgb(175,169,236);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">can tighten, not expand</text>

  <rect x="476" y="154" width="180" height="128" rx="8" style="fill:rgb(60,52,137);stroke:rgb(175,169,236);stroke-width:0.5px"/>
  <text x="566" y="178" text-anchor="middle" style="fill:rgb(200,194,245);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:14px;font-weight:500">restricted domain</text>
  <text x="566" y="202" text-anchor="middle" style="fill:rgb(175,169,236);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">capability restriction</text>
  <text x="566" y="220" text-anchor="middle" style="fill:rgb(175,169,236);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">parameter-domain restriction</text>
  <text x="566" y="246" text-anchor="middle" style="fill:rgb(200,194,245);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:13px;font-weight:500">A'(s) ⊆ A(s)</text>
</g>

<line x1="244" y1="218" x2="270" y2="218" marker-end="url(#arrow)" style="stroke:rgb(156,154,146);stroke-width:1.5px;opacity:0.6;fill:none"/>
<line x1="450" y1="218" x2="476" y2="218" marker-end="url(#arrow)" style="stroke:rgb(156,154,146);stroke-width:1.5px;opacity:0.6;fill:none"/>

<g opacity="0.55">
  <rect x="96" y="340" width="240" height="42" rx="6" style="fill:rgb(8,80,65);stroke:rgb(93,202,165);stroke-width:0.5px"/>
  <text x="216" y="358" text-anchor="middle" style="fill:rgb(93,202,165);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">candidate generation / reasoning core</text>
  <text x="216" y="374" text-anchor="middle" style="fill:rgb(93,202,165);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">can only read restricted domain</text>

  <rect x="384" y="340" width="240" height="42" rx="6" style="fill:rgb(113,43,19);stroke:rgb(240,153,123);stroke-width:0.5px"/>
  <text x="504" y="358" text-anchor="middle" style="fill:rgb(240,153,123);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">mediator / release boundary</text>
  <text x="504" y="374" text-anchor="middle" style="fill:rgb(240,153,123);font-family:'Anthropic Sans',-apple-system,'system-ui','Segoe UI',sans-serif;font-size:12px">downstream gate, not anchor substitute</text>
</g>

<line x1="566" y1="282" x2="216" y2="340" marker-end="url(#arrow)" style="stroke:rgb(156,154,146);stroke-width:1.5px;opacity:0.6;fill:none"/>
<line x1="566" y1="282" x2="504" y2="340" marker-end="url(#arrow)" style="stroke:rgb(156,154,146);stroke-width:1.5px;opacity:0.35;fill:none"/>
</svg>
