[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eva-agent"
version = "0.1.0"
description = "Existence-centered agent runtime experiment aligned with EVA theory"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["eva*", "stability_metrics*", "inheritance_distillation*"]
